[project]
name = "prescriptrace-backend"
version = "0.1.0"
description = "PrescripTrace API: medication safety and recall checks (decision support only)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy>=2.0.32,<2.1",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "httpx>=0.27",
    "rapidfuzz>=3.9",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.9",
    "pytesseract>=0.3.10",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pdfplumber>=0.11",
    "ijson>=3.3",
]

[project.optional-dependencies]
# Optional vision-LLM OCR (off by default; sends images to Anthropic). See app/core/ocr/vision_llm.py
llm = ["anthropic>=1.0"]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.isort]
# The local alembic/ migrations folder is not the alembic package.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["pytesseract.*", "cv2.*", "slowapi.*", "pdfplumber.*", "anthropic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: tests that need a running PostgreSQL (DATABASE_URL)"]
